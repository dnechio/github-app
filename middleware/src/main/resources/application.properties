# ============================================================
# Configuracoes do Middleware Camera-ERP
# ============================================================

# --- Cameras Datalogic P30M ---
camera.1.ip=192.168.0.10
camera.1.port=5000
camera.1.name=Camera-01

camera.2.ip=192.168.0.11
camera.2.port=5000
camera.2.name=Camera-02

# Timeout de conexao TCP (ms)
camera.connection.timeout.ms=5000
# Intervalo entre tentativas de reconexao (ms)
camera.reconnect.interval.ms=3000
# Numero maximo de tentativas de reconexao
camera.reconnect.max.attempts=10

# --- Sankhya ERP ---
sankhya.base.url=http://localhost:8080/mge
sankhya.app.key=SEU_APP_KEY_AQUI
sankhya.username=SEU_USUARIO
sankhya.password=SUA_SENHA

# Timeout das chamadas HTTP ao Sankhya (ms)
sankhya.http.timeout.ms=10000

# --- Middleware ---
# Porta HTTP para receber comandos do ERP
middleware.http.port=8090

# Delimitador usado pela camera na string de dados
camera.data.delimiter=;
