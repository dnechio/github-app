version: "3.9"

# Infraestrutura local para desenvolvimento/testes
# Sobe MongoDB, Redis, Qdrant e MinIO (S3 local)
# NÃO inclui a API nem o file-processor — rode-os diretamente

services:

  mongodb:
    image: mongo:7.0
    container_name: cp_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: criminal_player_v2
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: cp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: cp_qdrant
    ports:
      - "6333:6333"    # HTTP / REST
      - "6334:6334"    # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cp_minio
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Console web (http://localhost:9001)
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria o bucket automaticamente ao subir
  minio-setup:
    image: minio/mc:latest
    container_name: cp_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/criminal-player-dev;
        mc anonymous set download local/criminal-player-dev;
        echo 'Bucket criado com sucesso';
      "

volumes:
  mongo_data:
  redis_data:
  qdrant_data:
  minio_data:
