[tool.poetry]
name = "monkee-ai-agent-file-processor"
version = "2.0.0"
description = "Criminal Player AI v2.0 — File Processor Worker"
authors = ["Monkee Labs"]
python = "^3.12"

[tool.poetry.dependencies]
python = "^3.12"
celery = {extras = ["redis"], version = "^5.4.0"}
redis = "^5.2.0"
boto3 = "^1.35.0"
openai = "^1.54.0"
qdrant-client = "^1.12.0"
langchain-text-splitters = "^0.3.0"
pymupdf = "^1.24.0"
python-docx = "^1.1.0"
openpyxl = "^3.1.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
pymongo = "^4.10.0"
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
